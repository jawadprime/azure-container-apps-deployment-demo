parameters:
  - name: jobName
    type: string
  - name: dockerfilePath
    type: string
  - name: imageRepository
    type: string
  - name: acrLoginServer
    type: string
  - name: acrServiceConnection
    type: string

jobs:
  - job: ${{ parameters.jobName }}
    displayName: Build & Push ${{ parameters.imageRepository }}
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        clean: true

      - task: SonarCloudPrepare@3
        displayName: Prepare SonarCloud Analysis
        inputs:
          SonarCloud: 'sc-sonarcloud'
          organization: 'jawad-weeb-ogranization'
          scannerMode: 'dotnet'
          projectKey: 'jawad-weeb-ogranization_Practise-DevOps'
          projectName: 'Practise DevOps'

      - task: DotNetCoreCLI@2
        displayName: Build Solution
        inputs:
          command: 'build'
          projects: '**/*.sln'

      - task: SonarCloudAnalyze@3
        displayName: Run SonarCloud Analysis

      - task: Docker@2
        displayName: Build and push to ACR
        inputs:
          command: buildAndPush
          containerRegistry: ${{ parameters.acrServiceConnection }}
          repository: ${{ parameters.imageRepository }}
          dockerfile: ${{ parameters.dockerfilePath }}
          buildContext: $(Build.SourcesDirectory)
          tags: |
            $(Build.SourceVersion)
