trigger:
  batch: true
  branches:
    include:
      - master
      - release/*

variables:
  - group: ContainerAppsDemo-dev

stages:
  - stage: DeployContainerRegistry
    displayName: Deploy Container Registry

    jobs:
      - template: ../jobs/deploy-bicep.yml
        parameters:
          jobName: DeployContainerRegistry
          environment: containerappsdemo-dev
          azureServiceConnection: $(AZURE_SERVICE_CONNECTION)
          resourceGroup: $(RESOURCE_GROUP)
          bicepFile: infrastructureAsCode/containerRegistry/containerRegistry.bicep
          bicepParameters: >
            acrName=$(ACR_NAME)
            location="$(LOCATION)"

  - stage: DeployLogAnalytics
    displayName: Deploy Log Analytics

    jobs:
      - template: ../jobs/deploy-bicep.yml
        parameters:
          jobName: DeployLogAnalytics
          environment: containerappsdemo-dev
          azureServiceConnection: $(AZURE_SERVICE_CONNECTION)
          resourceGroup: $(RESOURCE_GROUP)
          bicepFile: infrastructureAsCode/logAnalytics/logAnalytics.bicep
          bicepParameters: >
            workspaceName=$(LOG_ANALYTICS_NAME)
            location="$(LOCATION)"

  - stage: DeployContainerAppsEnvironment
    displayName: Deploy Container Apps

    dependsOn:
      - DeployContainerRegistry
      - DeployLogAnalytics

    jobs:
      - template: ../jobs/deploy-bicep.yml
        parameters:
          jobName: DeployContainerAppsEnvironment
          environment: containerappsdemo-dev
          azureServiceConnection: $(AZURE_SERVICE_CONNECTION)
          resourceGroup: $(RESOURCE_GROUP)
          bicepFile: infrastructureAsCode/containerApps/containerApps.bicep
          bicepParameters: >
            environmentName=$(CONTAINER_APP_ENVIRONMENT_NAME)
            acrName=$(ACR_NAME)
            workspaceName=$(LOG_ANALYTICS_NAME)
            location="$(LOCATION)"